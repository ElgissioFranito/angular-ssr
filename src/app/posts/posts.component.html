<div class="max-w-4xl mx-auto py-8">
    <h2 class="text-3xl font-bold mb-6 text-primary">Liste des Articles</h2>

    @if (errorMessage) {
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            {{ errorMessage }}
        </div>
    }

    <div class="grid gap-4">
        @for (post of posts; track $index) {
        <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm hover:shadow-md transition-shadow">
            <h3 class="text-xl font-semibold mb-2 text-gray-800">{{ post.title }}</h3>
            <p class="text-gray-600 mb-4">{{ post.body | truncate:50 }}</p>
            <a [routerLink]="['/posts', post.id]"
                class="inline-block bg-primary text-white px-4 py-2 rounded hover:bg-primary/90 transition-colors">
                Lire plus →
            </a>
        </div>
        }
    </div>
</div>
